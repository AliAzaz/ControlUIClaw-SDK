<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ControlUIClaw SDK — Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sidebar-w: 280px;
      --bg: #f9f9f9;
      --bg-sidebar: #1a1a1a;
      --bg-sidebar-hover: #2a2a2a;
      --bg-sidebar-active: #333;
      --bg-input: #ffffff;
      --bg-user-msg: #f0f0f0;
      --bg-assist-msg: #ffffff;
      --bg-thinking: #faf5ff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-sidebar: #e0e0e0;
      --text-sidebar-dim: #888;
      --border: #e5e5e5;
      --accent: #7c5cfc;
      --accent-hover: #6a4ce8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100vh;
      background: var(--bg-sidebar); display: flex; flex-direction: column;
      border-right: 1px solid #333;
    }
    .sidebar-header {
      padding: 16px 16px 12px; border-bottom: 1px solid #333;
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-header .logo {
      width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
    }
    .sidebar-header h1 { font-size: 15px; font-weight: 600; color: #fff; }
    .sidebar-header .version { font-size: 11px; color: var(--text-sidebar-dim); margin-left: auto; }

    .connect-section { padding: 12px 16px; border-bottom: 1px solid #333; }
    .connect-section label { font-size: 11px; color: var(--text-sidebar-dim); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .connect-section input {
      width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid #444;
      background: #2a2a2a; color: #e0e0e0; font-size: 13px; margin-bottom: 8px;
      outline: none; transition: border-color 0.15s;
    }
    .connect-section input:focus { border-color: var(--accent); }
    .connect-row { display: flex; gap: 6px; margin-top: 4px; }
    .btn {
      padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
      font-weight: 500; font-size: 12px; color: #fff; transition: background 0.15s, opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-connect { background: var(--accent); flex: 1; }
    .btn-connect:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-disconnect { background: #444; }
    .btn-disconnect:hover { background: #555; }

    .status-bar {
      padding: 8px 16px; display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid #333;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.off { background: #555; }
    .status-dot.on { background: var(--green); }
    .status-dot.connecting { background: var(--yellow); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 12px; color: var(--text-sidebar-dim); }

    .sessions-header {
      padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between;
    }
    .sessions-header span { font-size: 11px; color: var(--text-sidebar-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .btn-icon {
      width: 28px; height: 28px; border-radius: 6px; border: none; cursor: pointer;
      background: transparent; color: var(--text-sidebar-dim); font-size: 16px;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }
    .btn-icon:hover { background: var(--bg-sidebar-hover); color: #fff; }

    .session-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .session-list::-webkit-scrollbar { width: 4px; }
    .session-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    .session-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
      transition: background 0.15s;
    }
    .session-item:hover { background: var(--bg-sidebar-hover); }
    .session-item.active { background: var(--bg-sidebar-active); }
    .session-item .title {
      font-size: 13px; color: var(--text-sidebar); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; font-weight: 500;
    }
    .session-item .meta {
      font-size: 11px; color: var(--text-sidebar-dim); margin-top: 2px;
      display: flex; gap: 8px; align-items: center;
    }
    .session-item .meta .status-badge {
      padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.running { background: #22c55e22; color: var(--green); }
    .status-badge.idle { background: #f59e0b22; color: var(--yellow); }
    .status-badge.error { background: #ef444422; color: var(--red); }

    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid #333; font-size: 11px;
      color: var(--text-sidebar-dim); text-align: center;
    }

    /* ── Sidebar Nav Tabs ────────────────────────────────────── */
    .sidebar-nav {
      display: flex; border-bottom: 1px solid #333;
    }
    .sidebar-nav button {
      flex: 1; padding: 10px 0; border: none; background: transparent;
      color: var(--text-sidebar-dim); font-size: 12px; font-weight: 600;
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .sidebar-nav button:hover { color: var(--text-sidebar); background: var(--bg-sidebar-hover); }
    .sidebar-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
    .sidebar-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .sidebar-panel.active { display: flex; }

    /* ── Channels View ───────────────────────────────────────── */
    .channels-view { display: none; flex: 1; flex-direction: column; height: 100vh; background: #141414; }
    .channels-view.active { display: flex; }
    .chat-view { display: flex; flex: 1; flex-direction: column; height: 100vh; }
    .chat-view.hidden { display: none; }

    .channels-header {
      padding: 32px 40px 12px; flex-shrink: 0;
    }
    .channels-header h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .channels-header p { font-size: 14px; color: #888; }

    .channels-list {
      flex: 1; overflow-y: auto; padding: 16px 40px 40px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .channels-list::-webkit-scrollbar { width: 4px; }
    .channels-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    /* ── Channel Row (collapsed) ─────────────────────────────── */
    .ch-row {
      background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 14px;
      overflow: hidden; transition: border-color 0.2s;
    }
    .ch-row.expanded { border-color: #3a3a3a; }
    .ch-row-header {
      display: flex; align-items: center; padding: 16px 20px; gap: 14px; cursor: default;
    }
    .ch-icon {
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .ch-icon.whatsapp { background: #25d366; color: #fff; }
    .ch-icon.telegram { background: #229ed9; color: #fff; }
    .ch-icon.discord { background: #5865f2; color: #fff; }
    .ch-icon.slack { background: #e01e5a; color: #fff; }
    .ch-icon.signal { background: #3a76f0; color: #fff; }
    .ch-icon.imessage { background: #34c759; color: #fff; }
    .ch-icon.googlechat { background: #1a73e8; color: #fff; }
    .ch-icon.nostr { background: #8b5cf6; color: #fff; }
    .ch-icon.default { background: #555; color: #fff; }

    .ch-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .ch-label { font-size: 16px; font-weight: 600; color: #fff; }
    .ch-row-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .btn-ch-connect {
      padding: 8px 22px; border-radius: 8px; border: none; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-ch-connect.connect { background: #c87533; color: #fff; }
    .btn-ch-connect.connect:hover { background: #d98a44; }
    .btn-ch-connect.close { background: #333; color: #ccc; }
    .btn-ch-connect.close:hover { background: #444; }
    .btn-ch-connect.coming-soon {
      background: transparent; color: #666; border: 1px solid #333;
      cursor: default; font-weight: 500;
    }
    .btn-ch-connect.connected-badge {
      background: #22c55e22; color: #22c55e; cursor: default;
    }

    /* ── Channel Row (expanded body) ─────────────────────────── */
    .ch-row-body {
      display: none; padding: 0 20px 24px;
    }
    .ch-row.expanded .ch-row-body { display: block; }

    .ch-expand-content {
      display: flex; gap: 32px; padding-top: 8px;
      border-top: 1px solid #2a2a2a; padding-top: 20px;
    }

    /* Left: How to connect steps */
    .ch-steps { flex: 1; min-width: 200px; }
    .ch-steps-title { font-size: 13px; font-weight: 600; color: #999; margin-bottom: 16px; }
    .ch-step {
      display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start;
    }
    .ch-step-num {
      width: 26px; height: 26px; border-radius: 50%; background: #c87533;
      color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ch-step-text { flex: 1; }
    .ch-step-text strong { display: block; color: #e0e0e0; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .ch-step-text span { color: #888; font-size: 12px; line-height: 1.5; }

    /* Right: Input / QR area */
    .ch-input-area { flex: 1; min-width: 220px; }
    .ch-input-title { font-size: 13px; font-weight: 600; color: #999; margin-bottom: 12px; }
    .ch-token-input {
      width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #333;
      background: #252525; color: #ccc; font-size: 13px; font-family: var(--mono);
      outline: none; transition: border-color 0.15s;
    }
    .ch-token-input:focus { border-color: #c87533; }
    .ch-token-input::placeholder { color: #555; }
    .btn-save-connect {
      width: 100%; margin-top: 12px; padding: 11px 0; border-radius: 8px; border: none;
      background: #c87533; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-save-connect:hover { background: #d98a44; }
    .btn-save-connect:disabled { opacity: 0.4; cursor: default; }

    /* Slack: two inputs */
    .ch-slack-inputs { display: flex; flex-direction: column; gap: 10px; }
    .ch-slack-inputs .ch-input-label { font-size: 11px; color: #777; margin-bottom: 3px; }

    /* WhatsApp QR */
    .ch-qr-area { display: flex; flex-direction: column; align-items: center; }
    .ch-qr-placeholder {
      width: 180px; height: 180px; border-radius: 10px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; overflow: hidden;
    }
    .ch-qr-placeholder img { width: 100%; height: 100%; object-fit: contain; }
    .ch-qr-placeholder .qr-spinner {
      width: 32px; height: 32px; border: 3px solid #eee;
      border-top-color: #c87533; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ch-pairing-code {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: #252525; border-radius: 8px; border: 1px solid #333;
    }
    .ch-pairing-code span { font-family: var(--mono); font-size: 14px; color: #ccc; letter-spacing: 1px; }
    .ch-pairing-code button {
      background: none; border: none; color: #888; cursor: pointer;
      font-size: 16px; padding: 2px 4px; transition: color 0.15s;
    }
    .ch-pairing-code button:hover { color: #fff; }
    .ch-qr-status { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
    .ch-qr-status.success { color: #22c55e; }
    .ch-qr-status.error { color: #ef4444; }

    /* ── Channel list in sidebar ─────────────────────────────── */
    .channel-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .channel-list-item {
      padding: 8px 12px; border-radius: 8px; cursor: default; margin-bottom: 2px;
      display: flex; align-items: center; gap: 10px;
    }
    .channel-list-item .ch-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .channel-list-item .ch-dot.on { background: var(--green); }
    .channel-list-item .ch-dot.off { background: #555; }
    .channel-list-item .ch-dot.warn { background: var(--yellow); }
    .channel-list-item .ch-name { font-size: 13px; color: var(--text-sidebar); }
    .channel-list-item .ch-state { font-size: 11px; color: var(--text-sidebar-dim); margin-left: auto; }

    /* ── Main Chat Area ──────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }

    .chat-header {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; background: #fff; flex-shrink: 0;
    }
    .chat-header .session-title { font-size: 15px; font-weight: 600; }
    .chat-header .session-key { font-size: 12px; color: var(--text-secondary); font-family: var(--mono); }
    .chat-header .thinking-select {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
    }
    .chat-header .thinking-select label { font-size: 12px; color: var(--text-secondary); }
    .chat-header .thinking-select select {
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: #fff; font-size: 12px; color: var(--text); outline: none;
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .msg {
      max-width: 720px; width: 100%; margin: 0 auto; padding: 0 24px;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .msg .role-label {
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    }
    .msg.user .role-label { color: var(--accent); }
    .msg.assistant .role-label { color: #16a34a; }
    .msg.system .role-label { color: var(--text-secondary); }

    .msg .bubble {
      font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { color: var(--text); }
    .msg.assistant .bubble { color: var(--text); }
    .msg.system .bubble { color: var(--text-secondary); font-style: italic; font-size: 13px; }

    .msg .thinking-block {
      margin-top: 8px; padding: 10px 14px; border-radius: 8px; background: var(--bg-thinking);
      border-left: 3px solid #c084fc; font-size: 13px; color: #6b21a8; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg .thinking-block .thinking-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      color: #9333ea; margin-bottom: 4px;
    }

    .msg .meta-line {
      margin-top: 10px; display: flex; align-items: center; gap: 2px;
      font-size: 12px; color: #999; font-family: var(--font);
    }
    .msg .meta-line .meta-role {
      font-weight: 600; color: #888; margin-right: 2px;
    }
    .msg .meta-line .meta-sep {
      margin: 0 6px; color: #ccc;
    }
    .msg .meta-line .meta-val {
      font-family: var(--mono); font-size: 11px; color: #888;
    }
    .msg .meta-line .meta-val.up { color: #7c5cfc; }
    .msg .meta-line .meta-val.down { color: #16a34a; }
    .msg .meta-line .meta-val.ctx { color: #f59e0b; }
    .msg .meta-line .meta-val.model { color: #666; font-weight: 500; }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-secondary); gap: 8px;
    }
    .empty-state .icon { font-size: 48px; opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    /* ── Input Area ──────────────────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px; border-top: 1px solid var(--border); background: #fff; flex-shrink: 0;
    }
    .input-row {
      max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    }
    .input-row textarea {
      flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg-input); font-size: 14px; font-family: var(--font); color: var(--text);
      resize: none; outline: none; min-height: 44px; max-height: 160px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    .input-row textarea:focus { border-color: var(--accent); }
    .input-row textarea::placeholder { color: #aaa; }
    .btn-send {
      width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, opacity 0.15s; flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-send:disabled { opacity: 0.3; cursor: default; }
    .btn-send svg { width: 18px; height: 18px; }

    /* ── Event Log (collapsible) ─────────────────────────────── */
    .event-log-toggle {
      padding: 6px 16px; background: #f5f5f5; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; gap: 6px; user-select: none; flex-shrink: 0;
    }
    .event-log-toggle:hover { background: #eee; }
    .event-log-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    .event-log-toggle.open .arrow { transform: rotate(90deg); }
    .event-log {
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
      background: #1a1a2e; flex-shrink: 0;
    }
    .event-log.open { max-height: 200px; }
    .event-log-inner {
      padding: 10px 16px; font-family: var(--mono); font-size: 11px; color: #a0a0c0;
      line-height: 1.6; overflow-y: auto; max-height: 200px; white-space: pre-wrap; word-break: break-all;
    }
    .event-log-inner .ev-connect { color: var(--green); }
    .event-log-inner .ev-disconnect { color: var(--red); }
    .event-log-inner .ev-event { color: var(--yellow); }
    .event-log-inner .ev-error { color: #f87171; }
    .event-log-inner .ev-info { color: #818cf8; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">C</div>
    <h1>ControlUIClaw</h1>
    <span class="version">SDK</span>
  </div>

  <div class="connect-section">
    <label>Gateway URL</label>
    <input id="url" value="ws://localhost:18789" spellcheck="false" />
    <label>Token</label>
    <input id="token" type="password" placeholder="Optional" value="mWPzkdOSV37FK0RWKS3YFSbHkaUAYscifD7UyJgvVLXTldyS" />
    <div class="connect-row">
      <button class="btn btn-connect" id="btnConnect">Connect</button>
      <button class="btn btn-disconnect" id="btnDisconnect">&#x2715;</button>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-dot off" id="dot"></span>
    <span class="status-text" id="statusLabel">Disconnected</span>
  </div>

  <div class="sidebar-nav">
    <button class="active" id="navChat" data-tab="chat">Chat</button>
    <button id="navChannels" data-tab="channels">Channels</button>
  </div>

  <!-- Chat panel -->
  <div class="sidebar-panel active" id="panelChat">
    <div class="sessions-header">
      <span>Sessions</span>
      <button class="btn-icon" id="btnNewSession" title="New session">+</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- Channels panel -->
  <div class="sidebar-panel" id="panelChannels">
    <div class="sessions-header">
      <span>Channels</span>
      <button class="btn-icon" id="btnRefreshChannels" title="Refresh">&#x21bb;</button>
    </div>
    <div class="channel-list" id="channelSidebarList"></div>
  </div>

  <div class="sidebar-footer">ControlUIClaw SDK Test Interface</div>
</aside>

<!-- ── Main ─────────────────────────────────────────────────── -->
<div class="main">

  <!-- Channels View -->
  <div class="channels-view" id="channelsView">
    <div class="channels-header">
      <h2>Channels</h2>
      <p>Connect your messaging apps to start receiving and sending messages.</p>
    </div>
    <div class="channels-list" id="channelsList"></div>
  </div>

  <!-- Chat View -->
  <div class="chat-view" id="chatView">
  <div class="chat-header">
    <div>
      <div class="session-title" id="chatTitle">New Conversation</div>
      <div class="session-key" id="chatSessionKey">No session selected</div>
    </div>
    <div class="thinking-select">
      <label for="thinkingLevel">Thinking:</label>
      <select id="thinkingLevel">
        <option value="off">Off</option>
        <option value="minimal">Minimal</option>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="xhigh">Max</option>
        <option value="adaptive">Adaptive</option>
      </select>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#9672;</div>
      <p>Connect to a gateway and start chatting</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="msgInput" placeholder="Send a message..." rows="1" disabled></textarea>
      <button class="btn-send" id="btnSend" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>

  <div class="event-log-toggle" id="logToggle">
    <span class="arrow">&#9654;</span> Event Log
  </div>
  <div class="event-log" id="eventLog">
    <div class="event-log-inner" id="logInner"></div>
  </div>
  </div><!-- /chat-view -->
</div>

<script>
  // ── DOM refs ──────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const dot = $("dot");
  const statusLabel = $("statusLabel");
  const btnSend = $("btnSend");
  const msgInput = $("msgInput");
  const messagesEl = $("messages");
  const sessionList = $("sessionList");
  const chatTitle = $("chatTitle");
  const chatSessionKey = $("chatSessionKey");
  const thinkingLevel = $("thinkingLevel");
  const logToggle = $("logToggle");
  const eventLog = $("eventLog");
  const logInner = $("logInner");

  let ControlUIClaw = null; // loaded dynamically
  let claw = null;
  let unsubHealth = null;
  let unsubChat = null;
  let activeSessionKey = null;
  let sessions = [];
  let sdkAvailable = false;

  // ── Helpers ───────────────────────────────────────────────
  function hideEmptyState() {
    var es = $("emptyState");
    if (es) es.style.display = "none";
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtNum(n) {
    if (n === undefined || n === null) return "\u2014";
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
    if (n >= 1_000) return (n / 1_000).toFixed(1) + "k";
    return n.toLocaleString();
  }

  // ── Event log ─────────────────────────────────────────────
  logToggle.addEventListener("click", () => {
    logToggle.classList.toggle("open");
    eventLog.classList.toggle("open");
  });

  function logEvent(cls, text) {
    const span = document.createElement("span");
    span.className = "ev-" + cls;
    span.textContent = "[" + new Date().toLocaleTimeString() + "] " + text + "\n";
    logInner.appendChild(span);
    logInner.scrollTop = logInner.scrollHeight;
  }

  // ── Status ────────────────────────────────────────────────
  function setStatus(state) {
    var visual = state || "off";
    dot.className = "status-dot " + visual;
    var labels = { on: "Connected", connecting: "Connecting...", off: "Disconnected", "": "Disconnected" };
    statusLabel.textContent = labels[state] || "Disconnected";
    var connected = state === "on";
    btnSend.disabled = !connected;
    msgInput.disabled = !connected;
    if (connected) msgInput.focus();
  }

  // ── Render messages ───────────────────────────────────────

  /** Build the compact metadata line:  Assistant · 19:02 · ↑30.6k · ↓9 · 15% ctx · gpt-5.4 */
  function buildMetaLine(role, opts) {
    opts = opts || {};
    var usage = opts.usage;
    var model = opts.model;
    var time = opts.time;
    var roleLabel = { user: "You", assistant: "Assistant", system: "System" }[role] || role;
    var ts = time || new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    var h = '<div class="meta-line">';
    h += '<span class="meta-role">' + roleLabel + '</span>';
    h += '<span class="meta-sep">&middot;</span><span class="meta-val">' + ts + '</span>';

    if (usage) {
      if (usage.input !== undefined) {
        h += '<span class="meta-sep">&middot;</span><span class="meta-val up">&uarr;' + fmtNum(usage.input) + '</span>';
      }
      if (usage.output !== undefined) {
        h += '<span class="meta-sep">&middot;</span><span class="meta-val down">&darr;' + fmtNum(usage.output) + '</span>';
      }
      if (usage.totalTokens !== undefined) {
        var pct = Math.round((usage.totalTokens / 200000) * 100);
        h += '<span class="meta-sep">&middot;</span><span class="meta-val ctx">' + pct + '% ctx</span>';
      }
    }

    if (model) {
      h += '<span class="meta-sep">&middot;</span><span class="meta-val model">' + escapeHtml(model) + '</span>';
    }

    h += '</div>';
    return h;
  }

  /** Extract model name from raw gateway payload */
  function extractModel(raw) {
    if (!raw) return null;
    return raw.model || raw.modelId || raw.modelName
      || (raw.message && (raw.message.model || raw.message.modelId))
      || null;
  }

  function addMessage(role, text, opts) {
    opts = opts || {};
    hideEmptyState();
    var msg = document.createElement("div");
    msg.className = "msg " + role;
    if (opts.id) msg.id = opts.id;

    var detectedModel = opts.model || extractModel(opts.raw);

    var html = '<div class="bubble">' + escapeHtml(text) + '</div>';

    if (opts.thinking) {
      html += '<div class="thinking-block"><div class="thinking-label">Thinking</div>' + escapeHtml(opts.thinking) + '</div>';
    }

    html += buildMetaLine(role, { usage: opts.usage, model: detectedModel, time: opts.time });

    msg.innerHTML = html;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function updateStreamingMessage(runId, text, thinking) {
    var el = document.getElementById("stream-" + runId);
    if (!el) {
      hideEmptyState();
      el = document.createElement("div");
      el.className = "msg assistant";
      el.id = "stream-" + runId;
      el.innerHTML = '<div class="bubble"></div><div class="meta-line"><span class="meta-role">Assistant</span><span class="meta-sep">&middot;</span><span class="meta-val">streaming...</span></div>';
      messagesEl.appendChild(el);
    }
    var bubble = el.querySelector(".bubble");
    bubble.textContent = text;

    if (thinking) {
      var tb = el.querySelector(".thinking-block");
      if (!tb) {
        tb = document.createElement("div");
        tb.className = "thinking-block";
        tb.innerHTML = '<div class="thinking-label">Thinking</div><span class="thinking-text"></span>';
        var metaLine = el.querySelector(".meta-line");
        el.insertBefore(tb, metaLine);
      }
      tb.querySelector(".thinking-text").textContent = thinking;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function finalizeStreamingMessage(runId, usage, model, raw) {
    var el = document.getElementById("stream-" + runId);
    if (!el) return;
    el.removeAttribute("id");

    var oldMeta = el.querySelector(".meta-line");
    if (oldMeta) oldMeta.remove();

    var resolvedModel = model || extractModel(raw);
    el.insertAdjacentHTML("beforeend", buildMetaLine("assistant", { usage: usage, model: resolvedModel }));
  }

  // ── Session list rendering ────────────────────────────────
  function renderSessions() {
    sessionList.innerHTML = "";
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      var item = document.createElement("div");
      item.className = "session-item" + (s.key === activeSessionKey ? " active" : "");

      var title = s.displayName || s.derivedTitle || s.label || s.key;
      var statusCls = s.status === "running" ? "running" : s.status === "error" ? "error" : "idle";
      var date = s.updatedAt ? new Date(s.updatedAt).toLocaleDateString() : "";

      item.innerHTML = '<div class="title">' + escapeHtml(title) + '</div>' +
        '<div class="meta"><span class="status-badge ' + statusCls + '">' + (s.status || "idle") + '</span><span>' + date + '</span></div>';
      item.addEventListener("click", (function(sess) { return function() { selectSession(sess); }; })(s));
      sessionList.appendChild(item);
    }
  }

  function selectSession(s) {
    activeSessionKey = s.key;
    chatTitle.textContent = s.displayName || s.derivedTitle || s.label || "Conversation";
    chatSessionKey.textContent = s.key;
    renderSessions();
    loadHistory(s.key);
  }

  /** Normalize gateway chat.history payloads (messages, items, or nested shapes). */
  function historyMessagesFromResult(history) {
    if (!history) return [];
    if (Array.isArray(history)) return history;
    var h = history;
    var candidates = [h.messages, h.items, h.entries, h.turns, h.log];
    for (var i = 0; i < candidates.length; i++) {
      if (Array.isArray(candidates[i])) return candidates[i];
    }
    if (h.data && typeof h.data === "object") {
      var d = h.data;
      var nested = [d.messages, d.items, d.entries, d.turns];
      for (var j = 0; j < nested.length; j++) {
        if (Array.isArray(nested[j])) return nested[j];
      }
    }
    return [];
  }

  async function loadHistory(sessionKey) {
    // Clear transcript only — do not touch a global `emptyState` after this; that node is removed here.
    messagesEl.innerHTML = "";

    try {
      var history = await claw.chatHistory(sessionKey, { limit: 50 });
      var msgs = historyMessagesFromResult(history);
      if (msgs.length === 0) {
        messagesEl.innerHTML = '<div class="empty-state" style="display:flex"><div class="icon">&#9672;</div><p>No messages yet</p></div>';
        return;
      }
      console.log(msgs);
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var role = m.role === "user" || m.role === "human" ? "user" : m.role === "assistant" ? "assistant" : "system";
        var text = ControlUIClaw.extractText(m);
        addMessage(role, text, { thinking: m.thinking, usage: m.usage, model: m.model, raw: m.raw });
      }
    } catch (err) {
      addMessage("system", "Failed to load history: " + err.message);
    }
  }

  async function refreshSessions() {
    if (!claw || !claw.isConnected) return;
    try {
      sessions = await claw.listSessions();
      renderSessions();
    } catch (err) {
      logEvent("error", "Session list failed: " + err.message);
    }
  }

  function resetChatSurface() {
    messagesEl.innerHTML = '<div class="empty-state" id="emptyState" style="display:flex"><div class="icon">&#9672;</div><p>Connect to a gateway and start chatting</p></div>';
    sessionList.innerHTML = "";
    logInner.innerHTML = "";
    chatTitle.textContent = "New Conversation";
    chatSessionKey.textContent = "No session selected";
  }

  // ── Auto-resize textarea ──────────────────────────────────
  function autoResizeTextarea() {
    msgInput.style.height = "auto";
    msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + "px";
  }
  msgInput.addEventListener("input", autoResizeTextarea);

  // ── SDK-dependent features (loaded dynamically) ───────────
  async function initSDK() {
    try {
      var mod = await import("./dist/controluiclaw.js");
      ControlUIClaw = mod.ControlUIClaw;
      sdkAvailable = true;
      logEvent("info", "SDK loaded successfully");
    } catch (err) {
      logEvent("error", "SDK not available: " + err.message);
    }
  }

  // ── Connect ───────────────────────────────────────────────
  $("btnConnect").addEventListener("click", async function() {
    if (!sdkAvailable) {
      await initSDK();
      if (!sdkAvailable) {
        logEvent("error", "Cannot connect — SDK not loaded. Ensure dist/controluiclaw.js is built.");
        return;
      }
    }

    if (unsubHealth) unsubHealth();
    if (unsubChat) unsubChat();
    if (claw) claw.disconnect();

    var url = $("url").value.trim();
    var token = $("token").value.trim() || undefined;

    resetChatSurface();
    claw = ControlUIClaw.init({ url: url, token: token, thinking: thinkingLevel.value });
    setStatus("connecting");

    // Health events
    unsubHealth = claw.sessionHealth(async function(event) {
      var cls = event.code === "connected" ? "connect"
        : event.code === "disconnected" ? "disconnect"
        : event.code === "error" ? "error" : "event";
      logEvent(cls, "[" + event.code + "] " + event.message);

      if (event.code === "connected") setStatus("on");
      if (event.code === "disconnected") setStatus("");
      if (event.code === "reconnecting") setStatus("connecting");
      if (event.code === "sessions_changed") await refreshSessions();
    });

    // Chat events — streaming with thinking + usage
    var streamBuffers = new Map();
    var thinkingBuffers = new Map();

    unsubChat = claw.chatEvents(function(event) {
      if (event.sessionKey !== activeSessionKey) return;

      // Log every event type for debugging
      if (event.type !== "stream") {
        logEvent("event", "[" + event.type + "] run=" + (event.runId || "").slice(0, 8) +
          " model=" + (event.model || "—") +
          " usage=" + JSON.stringify(event.usage || null) +
          " raw.keys=" + Object.keys(event.raw || {}).join(","));
      }

      switch (event.type) {
        case "stream": {
          var buf = (streamBuffers.get(event.runId) || "") + event.text;
          streamBuffers.set(event.runId, buf);
          if (event.thinking) {
            var tb = (thinkingBuffers.get(event.runId) || "") + event.thinking;
            thinkingBuffers.set(event.runId, tb);
          }
          updateStreamingMessage(event.runId, buf, thinkingBuffers.get(event.runId));
          break;
        }
        case "final":
          if (!streamBuffers.has(event.runId) && event.text) {
            addMessage("assistant", event.text, { thinking: event.thinking, usage: event.usage, model: event.model, raw: event.raw });
          } else {
            finalizeStreamingMessage(event.runId, event.usage, event.model, event.raw);
          }
          streamBuffers.delete(event.runId);
          thinkingBuffers.delete(event.runId);
          logEvent("info", "[final] run=" + event.runId.slice(0, 8) +
            " model=" + (event.model || "—") +
            " tokens=" + JSON.stringify(event.usage || {}) +
            " raw.keys=" + Object.keys(event.raw || {}).join(","));
          break;
        case "error":
          addMessage("system", "Error: " + event.text);
          streamBuffers.delete(event.runId);
          thinkingBuffers.delete(event.runId);
          break;
        case "aborted":
          addMessage("system", "Run was aborted");
          streamBuffers.delete(event.runId);
          thinkingBuffers.delete(event.runId);
          break;
      }
    });

    // Connect
    var result = await claw.connect();
    if (!result.ok) {
      logEvent("error", "Connection failed: " + (result.error && result.error.message));
      setStatus("");
      return;
    }

    // Create default session if none active
    if (!activeSessionKey) {
      activeSessionKey = ControlUIClaw.createSessionKey();
      chatTitle.textContent = "New Conversation";
      chatSessionKey.textContent = activeSessionKey;
    }

    await refreshSessions();
    startChannelStatusListener();
    refreshChannels();
  });

  // ── Disconnect ────────────────────────────────────────────
  $("btnDisconnect").addEventListener("click", function() {
    if (unsubHealth) unsubHealth();
    if (unsubChat) unsubChat();
    if (unsubChannelStatus) unsubChannelStatus();
    if (claw) claw.disconnect();
    claw = null;
    channelData = null;
    renderChannelSidebar();
    setStatus("");
  });

  // ── New Session ───────────────────────────────────────────
  $("btnNewSession").addEventListener("click", function() {
    if (!sdkAvailable || !ControlUIClaw) return;
    activeSessionKey = ControlUIClaw.createSessionKey();
    chatTitle.textContent = "New Conversation";
    chatSessionKey.textContent = activeSessionKey;
    messagesEl.innerHTML = '<div class="empty-state" id="emptyState" style="display:flex"><div class="icon">&#9672;</div><p>Start a new conversation</p></div>';
    renderSessions();
  });

  // ── Send ──────────────────────────────────────────────────
  async function send() {
    if (!claw || !claw.isConnected) return;
    var text = msgInput.value.trim();
    if (!text) return;
    if (!activeSessionKey) {
      activeSessionKey = ControlUIClaw.createSessionKey();
      chatSessionKey.textContent = activeSessionKey;
    }

    msgInput.value = "";
    autoResizeTextarea();
    addMessage("user", text);

    try {
      var thinking = thinkingLevel.value;
      await claw.sendPrompt(activeSessionKey, text, {
        thinking: thinking !== "off" ? thinking : undefined,
      });
    } catch (err) {
      addMessage("system", "Send failed: " + err.message);
    }
  }

  btnSend.addEventListener("click", send);
  msgInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ── Sidebar Tab Navigation ──────────────────────────────────
  var currentTab = "chat";
  var navBtns = document.querySelectorAll(".sidebar-nav button");

  navBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      var tab = btn.dataset.tab;
      currentTab = tab;
      navBtns.forEach(function(b) { b.classList.toggle("active", b.dataset.tab === tab); });
      $("panelChat").classList.toggle("active", tab === "chat");
      $("panelChannels").classList.toggle("active", tab === "channels");
      $("chatView").classList.toggle("hidden", tab === "channels");
      $("channelsView").classList.toggle("active", tab === "channels");
      if (tab === "channels") refreshChannels();
    });
  });

  // ── Channel Config ──────────────────────────────────────────
  var channelLabelsDefault = {
    whatsapp: "WhatsApp", telegram: "Telegram", discord: "Discord",
    slack: "Slack", signal: "Signal", imessage: "iMessage",
    googlechat: "Google Chat", nostr: "Nostr",
  };

  // SVG icons per channel
  var channelSvgs = {
    whatsapp: '<svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.28-.1-.48-.15-.68.15s-.78.97-.96 1.17-.35.22-.65.07c-.3-.15-1.27-.47-2.42-1.49-.9-.8-1.5-1.78-1.67-2.08s-.02-.46.13-.61c.13-.14.3-.35.44-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.52-.08-.15-.68-1.64-.93-2.24-.25-.6-.5-.5-.68-.51h-.58c-.2 0-.52.07-.8.38s-1.04 1.02-1.04 2.48 1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.27.49 1.7.63.71.22 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.3.18-1.42-.08-.13-.28-.2-.58-.35zM12.05 21.8c-1.83 0-3.63-.49-5.2-1.42l-.37-.22-3.87 1.02 1.04-3.78-.24-.38A9.77 9.77 0 012.2 12.05c0-5.42 4.42-9.84 9.85-9.84a9.78 9.78 0 016.96 2.88 9.78 9.78 0 012.89 6.96c0 5.43-4.42 9.85-9.85 9.85zm0-21.6C5.63.2.4 5.43.4 12.05c0 2.08.54 4.12 1.58 5.92L.2 24l6.2-1.63a11.7 11.7 0 005.65 1.44c6.62 0 12.01-5.38 12.01-12S18.67.2 12.05.2z"/></svg>',
    telegram: '<svg viewBox="0 0 24 24"><path d="M11.99 0C5.37 0 0 5.37 0 12s5.37 12 11.99 12S24 18.63 24 12 18.61 0 11.99 0zm5.57 8.15l-1.67 7.88c-.12.57-.46.71-.93.44l-2.57-1.9-1.24 1.2c-.14.14-.25.25-.52.25l.19-2.63 4.82-4.35c.21-.19-.05-.29-.32-.12L9.37 13l-2.53-.79c-.55-.17-.56-.55.12-.82l9.88-3.81c.46-.17.86.11.72.77z"/></svg>',

    imessage: '<svg viewBox="0 0 24 24"><path d="M12 1.5C5.65 1.5.5 5.95.5 11.4c0 3.13 1.66 5.93 4.24 7.78-.12 1.2-.64 2.97-1.74 3.32 2.1-.04 3.83-1.24 4.76-2.14 1.32.38 2.76.6 4.24.6 6.35 0 11.5-4.45 11.5-9.9S18.35 1.5 12 1.5z"/></svg>',
    googlechat: '<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12l4.8 4.8V12c0-3.98 3.22-7.2 7.2-7.2h4.8L12 0zm0 24c6.63 0 12-5.37 12-12l-4.8-4.8V12c0 3.98-3.22 7.2-7.2 7.2H7.2L12 24z"/></svg>',
    nostr: '<svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.82 8 12 11.82 4.18 8 12 4.18zM4 9.18l7 3.5V19l-7-3.5V9.18zm16 0V15.5L13 19v-6.32l7-3.5z"/></svg>',
  };

  // Step instructions per channel type
  var channelSteps = {
    telegram: [
      { title: "Open @BotFather", desc: "Search for @BotFather in Telegram and start a chat." },
      { title: "Create a new bot", desc: "Send /newbot and follow the prompts to name your bot." },
      { title: "Paste your token", desc: "Copy the HTTP API token and paste it below." },
    ],
    whatsapp: [
      { title: "Open Linked Devices", desc: "Go to WhatsApp \u2192 Settings \u2192 Linked Devices." },
      { title: "Tap Link a Device", desc: "Tap 'Link a Device' and allow camera access." },
      { title: "Scan QR code", desc: "Point your phone at the QR code shown below." },
    ],
    discord: [
      { title: "Open Discord Developer Portal", desc: "Go to discord.com/developers and create an application." },
      { title: "Create a Bot", desc: "Navigate to Bot tab and click 'Add Bot'." },
      { title: "Copy the token", desc: "Click 'Reset Token', copy it and paste it below." },
    ],
    slack: [
      { title: "Create a Slack App", desc: "Go to api.slack.com/apps and create a new app." },
      { title: "Enable Socket Mode", desc: "Enable Socket Mode and generate an App-Level Token." },
      { title: "Add Bot Token Scopes", desc: "Add required scopes under OAuth, install the app, then paste both tokens." },
    ],
  };

  // Which channels are "coming soon" (no connect support yet)
  var comingSoonChannels = { signal: true, imessage: true, googlechat: true, nostr: true };

  // Track which channel row is expanded
  var expandedChannel = null;

  // ── Channel State ──────────────────────────────────────────
  var channelData = null;

  function resolveChannelState(ch) {
    if (!ch) return "unknown";
    if (ch.connected) return "connected";
    if (ch.running) return "running";
    if (ch.configured) return "configured";
    return "disconnected";
  }

  // ── Render Channels List ───────────────────────────────────
  function renderChannelsList() {
    var container = $("channelsList");

    var defaultOrder = ["telegram", "whatsapp", "discord", "slack", "signal", "imessage", "googlechat", "nostr"];
    var order = (channelData && channelData.channelOrder) ? channelData.channelOrder : defaultOrder;
    var labels = (channelData && channelData.channelLabels) || {};
    var channels = (channelData && channelData.channels) || {};

    var html = "";
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      var ch = channels[key] || null;
      var label = labels[key] || channelLabelsDefault[key] || key;
      var state = resolveChannelState(ch);
      var svg = channelSvgs[key] || channelSvgs.nostr;
      var iconCls = channelSvgs[key] ? key : "default";
      var isExpanded = expandedChannel === key;
      var isComing = comingSoonChannels[key] && state !== "connected" && state !== "running" && state !== "configured";

      html += '<div class="ch-row' + (isExpanded ? ' expanded' : '') + '" id="chrow-' + key + '">';

      // Header row
      html += '<div class="ch-row-header">';
      html += '<div class="ch-icon ' + iconCls + '">' + svg + '</div>';
      html += '<div class="ch-label">' + escapeHtml(label) + '</div>';
      html += '<div class="ch-row-right">';

      if (isComing) {
        html += '<span class="btn-ch-connect coming-soon">Coming Soon</span>';
      } else if (state === "connected") {
        if (isExpanded) {
          html += '<button class="btn-ch-connect close" onclick="toggleChannel(null)">Close</button>';
        } else {
          html += '<span class="btn-ch-connect connected-badge">Connected</span>';
          html += '<button class="btn-ch-connect close" style="margin-left:6px" onclick="toggleChannel(\'' + key + '\')">Manage</button>';
        }
      } else if (isExpanded) {
        html += '<button class="btn-ch-connect close" onclick="toggleChannel(null)">Close</button>';
      } else {
        html += '<button class="btn-ch-connect connect" onclick="toggleChannel(\'' + key + '\')">Connect</button>';
      }

      html += '</div></div>';

      // Expanded body
      html += '<div class="ch-row-body">';
      html += '<div class="ch-expand-content">';

      // Left: steps
      var steps = channelSteps[key];
      if (steps) {
        html += '<div class="ch-steps">';
        html += '<div class="ch-steps-title">How to connect</div>';
        for (var s = 0; s < steps.length; s++) {
          html += '<div class="ch-step">';
          html += '<div class="ch-step-num">' + (s + 1) + '</div>';
          html += '<div class="ch-step-text"><strong>' + escapeHtml(steps[s].title) + '</strong><span>' + escapeHtml(steps[s].desc) + '</span></div>';
          html += '</div>';
        }
        html += '</div>';
      }

      // Right: input area
      html += '<div class="ch-input-area">';
      if (key === "whatsapp") {
        html += '<div class="ch-input-title">Scan QR Code</div>';
        html += '<div class="ch-qr-area">';
        html += '<div class="ch-qr-placeholder" id="waQrBox"><div class="qr-spinner" id="waQrSpinner" style="display:none"></div><img id="waQrImg" style="display:none" /></div>';
        html += '<div class="ch-qr-status" id="waQrStatus">Click below to start pairing</div>';
        html += '</div>';
        html += '<button class="btn-save-connect" onclick="connectWhatsApp()" id="btnWaStart">' + (state === "connected" ? 'Reconnect' : 'Start QR Pairing') + '</button>';
        if (state === "connected" || state === "running" || state === "configured") {
          html += '<button class="btn-save-connect" style="background:#333;margin-top:8px" onclick="disconnectChannel(\'whatsapp\')">Disconnect</button>';
        }
      } else if (key === "telegram") {
        html += '<div class="ch-input-title">Bot Token</div>';
        html += '<input class="ch-token-input" id="telegramTokenInput" type="password" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v" />';
        html += '<button class="btn-save-connect" onclick="connectTelegram()">Save & Connect</button>';
        if (state === "connected" || state === "running" || state === "configured") {
          html += '<button class="btn-save-connect" style="background:#333;margin-top:8px" onclick="disconnectChannel(\'telegram\')">Disconnect</button>';
        }
      } else if (key === "discord") {
        html += '<div class="ch-input-title">Bot Token</div>';
        html += '<input class="ch-token-input" id="discordTokenInput" type="password" placeholder="MTIzNDU2Nzg5MDEy..." />';
        html += '<button class="btn-save-connect" onclick="connectDiscord()">Save & Connect</button>';
        if (state === "connected" || state === "running" || state === "configured") {
          html += '<button class="btn-save-connect" style="background:#333;margin-top:8px" onclick="disconnectChannel(\'discord\')">Disconnect</button>';
        }
      } else if (key === "slack") {
        html += '<div class="ch-slack-inputs">';
        html += '<div><div class="ch-input-label">Bot Token</div><input class="ch-token-input" id="slackBotInput" type="password" placeholder="xoxb-..." /></div>';
        html += '<div><div class="ch-input-label">App Token</div><input class="ch-token-input" id="slackAppInput" type="password" placeholder="xapp-..." /></div>';
        html += '</div>';
        html += '<button class="btn-save-connect" onclick="connectSlack()">Save & Connect</button>';
        if (state === "connected" || state === "running" || state === "configured") {
          html += '<button class="btn-save-connect" style="background:#333;margin-top:8px" onclick="disconnectChannel(\'slack\')">Disconnect</button>';
        }
      }
      html += '</div>';

      html += '</div></div></div>';
    }

    container.innerHTML = html;
  }

  function toggleChannel(key) {
    expandedChannel = (expandedChannel === key) ? null : key;
    renderChannelsList();
  }
  window.toggleChannel = toggleChannel;

  // ── Render Channel Sidebar List ────────────────────────────
  function renderChannelSidebar() {
    var list = $("channelSidebarList");
    if (!channelData) { list.innerHTML = ""; return; }
    var order = channelData.channelOrder || [];
    var labels = channelData.channelLabels || {};
    var channels = channelData.channels || {};
    var html = "";
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      var ch = channels[key] || null;
      var label = labels[key] || channelLabelsDefault[key] || key;
      var state = resolveChannelState(ch);
      var dotCls = state === "connected" ? "on" : state === "running" || state === "configured" ? "warn" : "off";
      html += '<div class="channel-list-item">';
      html += '<span class="ch-dot ' + dotCls + '"></span>';
      html += '<span class="ch-name">' + escapeHtml(label) + '</span>';
      html += '<span class="ch-state">' + state + '</span>';
      html += '</div>';
    }
    list.innerHTML = html;
  }

  // ── Refresh Channels ──────────────────────────────────────
  async function refreshChannels() {
    // Always render immediately with whatever data we have
    renderChannelsList();
    renderChannelSidebar();
    if (!claw || !claw.isConnected) return;
    try {
      channelData = await claw.getChannelsStatus(false);
      renderChannelsList();
      renderChannelSidebar();
      logEvent("info", "Channels status refreshed");
    } catch (err) {
      logEvent("error", "Channel refresh failed: " + err.message);
      // Still render with defaults on error
      renderChannelsList();
    }
  }

  $("btnRefreshChannels").addEventListener("click", function() { refreshChannels(); });

  // ── Channel Actions ───────────────────────────────────────
  async function connectWhatsApp() {
    if (!claw || !claw.isConnected) return;
    var qrImg = $("waQrImg");
    var qrSpinner = $("waQrSpinner");
    var qrStatus = $("waQrStatus");
    var btn = $("btnWaStart");
    if (btn) btn.disabled = true;
    if (qrSpinner) { qrSpinner.style.display = "block"; }
    if (qrImg) { qrImg.style.display = "none"; }
    if (qrStatus) { qrStatus.textContent = "Starting..."; qrStatus.className = "ch-qr-status"; }

    try {
      await claw.startWhatsAppChannelLogin({
        timeoutMs: 120000,
        onStatus: function(event) {
          switch (event.step) {
            case "qr_ready":
              if (qrSpinner) qrSpinner.style.display = "none";
              if (event.qrDataUrl && qrImg) {
                qrImg.src = event.qrDataUrl;
                qrImg.style.display = "block";
              }
              if (qrStatus) qrStatus.textContent = "Scan this QR code with WhatsApp";
              break;
            case "scanning":
              if (qrStatus) qrStatus.textContent = "Waiting for scan...";
              break;
            case "authenticating":
              if (qrStatus) qrStatus.textContent = "Authenticating...";
              break;
            case "connected":
              if (qrStatus) { qrStatus.textContent = "Connected!"; qrStatus.className = "ch-qr-status success"; }
              setTimeout(function() { refreshChannels(); }, 1500);
              break;
            case "failed":
              if (qrSpinner) qrSpinner.style.display = "none";
              if (qrStatus) { qrStatus.textContent = "Failed: " + (event.error || "unknown"); qrStatus.className = "ch-qr-status error"; }
              break;
          }
          logEvent("event", "[whatsapp] " + event.step + " \u2014 " + (event.message || ""));
        },
      });
    } catch (err) {
      logEvent("error", "WhatsApp login failed: " + err.message);
    } finally {
      if (btn) btn.disabled = false;
    }
  }
  window.connectWhatsApp = connectWhatsApp;

  async function connectTelegram() {
    if (!claw || !claw.isConnected) return;
    var input = $("telegramTokenInput");
    var token = input ? input.value.trim() : "";
    if (!token) return;
    try {
      await claw.setTelegramChannelToken(token);
      input.value = "";
      logEvent("info", "Telegram token set");
      expandedChannel = null;
      await refreshChannels();
    } catch (err) {
      logEvent("error", "Telegram connect failed: " + err.message);
    }
  }
  window.connectTelegram = connectTelegram;

  async function connectDiscord() {
    if (!claw || !claw.isConnected) return;
    var input = $("discordTokenInput");
    var token = input ? input.value.trim() : "";
    if (!token) return;
    try {
      await claw.setDiscordChannelToken(token);
      input.value = "";
      logEvent("info", "Discord token set");
      expandedChannel = null;
      await refreshChannels();
    } catch (err) {
      logEvent("error", "Discord connect failed: " + err.message);
    }
  }
  window.connectDiscord = connectDiscord;

  async function connectSlack() {
    if (!claw || !claw.isConnected) return;
    var botInput = $("slackBotInput");
    var appInput = $("slackAppInput");
    var botToken = botInput ? botInput.value.trim() : "";
    var appToken = appInput ? appInput.value.trim() : "";
    if (!botToken || !appToken) return;
    try {
      await claw.setSlackChannelTokens(botToken, appToken);
      botInput.value = "";
      appInput.value = "";
      logEvent("info", "Slack tokens set");
      expandedChannel = null;
      await refreshChannels();
    } catch (err) {
      logEvent("error", "Slack connect failed: " + err.message);
    }
  }
  window.connectSlack = connectSlack;

  async function disconnectChannel(channelId) {
    if (!claw || !claw.isConnected) return;
    try {
      var result = await claw.logoutChannel(channelId);
      logEvent("info", channelId + " disconnected (cleared=" + result.cleared + ")");
      expandedChannel = null;
      await refreshChannels();
    } catch (err) {
      logEvent("error", channelId + " disconnect failed: " + err.message);
    }
  }
  window.disconnectChannel = disconnectChannel;

  // ── Real-time Channel Status ──────────────────────────────
  var unsubChannelStatus = null;

  function startChannelStatusListener() {
    if (unsubChannelStatus) unsubChannelStatus();
    if (!claw) return;
    unsubChannelStatus = claw.onChannelStatus(function(event) {
      if (channelData) {
        channelData.channels = event.channels;
        channelData.channelAccounts = event.channelAccounts;
        if (currentTab === "channels") renderChannelsList();
        renderChannelSidebar();
      }
    });
  }

  // Render initial empty state
  renderChannelsList();

  // Try loading SDK in background (non-blocking)
  initSDK();
</script>

</body>
</html>
